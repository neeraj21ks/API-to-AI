[project]
name = "nexus-dataops"
version = "0.1.0"
description = "Evidence-driven autonomous DataOps platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nexus-demo = "nexus.demo:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
